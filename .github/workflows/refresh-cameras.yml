name: Refresh camera data

# Daily pull of ALPR camera locations from OSM via Overpass, plus an on-demand
# path. Commits public/data/cameras.json only when it actually changed, then
# kicks off the deploy workflow (a bot-authored push does not fire
# deploy.yml's on:push trigger, so we call it explicitly).
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write  # needed for `gh workflow run deploy.yml` below

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch cameras from Overpass
        run: node scripts/fetch_cameras.mjs public/data/cameras.json

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- public/data/cameras.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/cameras.json
          git commit -m "chore: refresh camera data from OSM"
          git push

      # GITHUB_TOKEN-authored pushes don't trigger other workflows' on:push,
      # so trigger the existing deploy workflow (it has workflow_dispatch).
      - name: Trigger deploy
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml
