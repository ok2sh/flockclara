name: Refresh transparency portal data

# Best-effort daily pull of the Flock Safety transparency portal page for
# Santa Clara PD, plus an on-demand path. The portal sits behind Cloudflare
# bot management, so a live fetch is often blocked; the script signals that
# with exit code 78, which this workflow treats as a clean no-op rather than
# a failure. Commits public/data/access.json only when it actually changed,
# then kicks off the deploy workflow (a bot-authored push does not fire
# deploy.yml's on:push trigger, so we call it explicitly).
on:
  schedule:
    - cron: '47 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write  # needed for `gh workflow run deploy.yml` below

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch transparency portal data
        id: fetch
        run: |
          set +e
          node scripts/fetch_access.mjs public/data/access.json
          code=$?
          set -e
          if [ "$code" -eq 78 ]; then
            echo "::notice::blocked by Cloudflare bot protection, skipping refresh"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -ne 0 ]; then
            echo "fetch_access.mjs failed with exit code $code"
            exit "$code"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for changes
        id: diff
        if: steps.fetch.outputs.skip != 'true'
        run: |
          if git diff --quiet -- public/data/access.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.fetch.outputs.skip != 'true' && steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/access.json
          git commit -m "chore: refresh transparency portal data"
          git push

      # GITHUB_TOKEN-authored pushes don't trigger other workflows' on:push,
      # so trigger the existing deploy workflow (it has workflow_dispatch).
      - name: Trigger deploy
        if: steps.fetch.outputs.skip != 'true' && steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml
